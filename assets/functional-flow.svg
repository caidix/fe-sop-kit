<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 2080" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect x="0" y="0" width="1000" height="2080" fill="#FFFFFF"/>

  <style>
    .band { rx: 16; }
    .title { font-size: 17px; font-weight: 700; }
