    .dec-t { fill: #6B5300; font-size: 13px; text-anchor: middle; font-weight: 600; }
    .branch { fill: #F4F8FC; stroke: #7A93B0; stroke-width: 1.5; }
    .edge { fill: none; stroke: #44515F; stroke-width: 1.6; }
    .edge-d { fill: none; stroke: #44515F; stroke-width: 1.6; stroke-dasharray: 6 4; }
    .lbl { fill: #44515F; font-size: 12px; }
  </style>

  <defs>
